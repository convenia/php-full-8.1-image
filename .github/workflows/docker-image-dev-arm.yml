# Builds, tests and publishes the arm64 development images of convenia/php-full on Docker Hub (copy of docker-image-dev.yml).
#
# The development target of every X.Y/Dockerfile in the matrix is published as the X.Y-dev-arm64 tag.
# A version goes into the matrix list when its Dockerfile gets the development target.
name: docker-image-dev-arm

on:
  # Publishes every version when a change lands on main
  push:
    branches:
      - main
  # Builds and tests every version, without publishing
  pull_request:
  # Weekly rebuild to pick up base image and package updates
  schedule:
    - cron: '0 0 * * 6'
  # Rebuilds every version, like the schedule
  workflow_dispatch:
    inputs:
      publish:
        description: Push the images to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: convenia/testing

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['8.5']
    # Publishes of the same tag run one at a time, so an older commit never overwrites a newer one.
    # Pull requests get their own group, so they never cancel a pending publish
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.version }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
    env:
      TAG: ${{ matrix.version }}-dev-arm64
      PUBLISH: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          # The default git context ignores the checkout: use the checked out repo root as context
          context: .
          file: ${{ matrix.version }}/Dockerfile
          target: development
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      # Same test as the production image, plus the development tools: they are in the PATH of sh,
      # and nvm works in a non-interactive bash
      - name: Test
        run: |
          docker run --rm "$IMAGE:$TAG" /run_tests.sh
          docker run --rm "$IMAGE:$TAG" sh -c 'php -m | grep -qx pcov && node --version && yarn --version && redocly --version && infection --version'
          docker run --rm "$IMAGE:$TAG" bash -c 'nvm --version'

      - name: Push
        if: env.PUBLISH == 'true'
        run: docker push "$IMAGE:$TAG"
