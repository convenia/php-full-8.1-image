# Builds, tests and publishes the development images of convenia/php-full on Docker Hub.
#
# The development target of every X.Y/Dockerfile in the matrix is published as the X.Y-dev tag.
# The tags are multi-arch (amd64 and arm64), so the docker client pulls the image of its own arch.
# A version goes into the matrix list when its Dockerfile gets the development target.
name: docker-image-dev

on:
  # Publishes every version when a change lands on main
  push:
    branches:
      - main
  # Builds and tests every version, without publishing
  pull_request:
  # Weekly rebuild to pick up base image and package updates
  schedule:
    - cron: '0 0 * * 6'
  # Rebuilds every version, like the schedule
  workflow_dispatch:
    inputs:
      publish:
        description: Push the images to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: convenia/testing

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['8.5']
    # Publishes of the same tag run one at a time, so an older commit never overwrites a newer one.
    # Pull requests get their own group, so they never cancel a pending publish
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.version }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
    env:
      TAG: ${{ matrix.version }}-dev
      PUBLISH: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.publish == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Emulates arm64 to build it on the amd64 runner
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          # The default git context ignores the checkout: use the checked out repo root as context
          context: .
          file: ${{ matrix.version }}/Dockerfile
          target: development
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      # Same test as the production image plus the development tools, run against the amd64 image that gets pushed:
      # the tools are in the PATH of sh, and nvm works in a non-interactive bash
      - name: Test
        run: |
          docker run --rm "$IMAGE:$TAG" /run_tests.sh
          docker run --rm "$IMAGE:$TAG" sh -c 'php -m | grep -qx pcov && node --version && yarn --version && redocly --version && infection --version'
          docker run --rm "$IMAGE:$TAG" bash -c 'nvm --version'

      # Pushes both archs in one multi-arch tag: amd64 comes from the builder cache, arm64 is built here
      - name: Push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.version }}/Dockerfile
          target: development
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
